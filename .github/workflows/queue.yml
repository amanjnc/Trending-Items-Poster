name: Collect and prepare news
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also publish ONE prepared item after collection'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: x-autopost-history
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.NEWS_QUEUE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-runtime
      - name: Collect, clean, resolve mentions and prepare ranked queue
        env:
          TWEETKIT_COOKIE: ${{ secrets.TWEETKIT_COOKIE }}
          TRENDING_DB: ${{ github.workspace }}/.local/actions/stories.db
          LIVE: ${{ github.event_name == 'schedule' || inputs.live }}
        shell: bash
        run: |
          args=(--mode collect)
          if [[ "$LIVE" == "true" ]]; then args+=(--live); fi
          .local/runtime/bin/python queue_worker.py "${args[@]}"
      - name: Save preparation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: posting-report.json
          if-no-files-found: ignore
          retention-days: 7
